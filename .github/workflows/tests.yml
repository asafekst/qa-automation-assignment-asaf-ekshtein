name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Anti-flakiness guard
        run: python scripts/check_anti_flake.py

      - name: Create output directories
        run: mkdir -p test-results/artifacts

      - name: Run API tests
        run: |
          set -euo pipefail
          # pytest exits 5 when zero tests match — capture output without failing (|| true).
          collect_log=$(python -m pytest tests/api -m "api and not smoke" --collect-only -q 2>&1 || true)
          if echo "$collect_log" | grep -q "no tests collected"; then
            python -m pytest tests/api -m "smoke and api" --maxfail=1
          else
            python -m pytest tests/api -m "smoke and api" --maxfail=1 -q \
              -o "addopts=-v --strict-markers"
            python -m pytest tests/api -m "api and not smoke"
          fi
        env:
          API_BASE_URL: https://jsonplaceholder.typicode.com

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright browsers and Ubuntu dependencies
        run: python -m playwright install --with-deps chromium

      - name: Anti-flakiness guard
        run: python scripts/check_anti_flake.py

      - name: Create output directories
        run: mkdir -p test-results/artifacts

      - name: Run UI tests
        run: |
          set -euo pipefail
          collect_log=$(python -m pytest tests/ui -m "ui and not smoke" --browser=chromium --collect-only -q 2>&1 || true)
          if echo "$collect_log" | grep -q "no tests collected"; then
            python -m pytest tests/ui -m "smoke and ui" --browser=chromium -n 2 --maxfail=1
          else
            python -m pytest tests/ui -m "smoke and ui" --browser=chromium -n 2 --maxfail=1 -q \
              -o "addopts=-v --strict-markers --browser=chromium --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure --output=test-results"
            python -m pytest tests/ui -m "ui and not smoke" --browser=chromium -n 2
          fi
        env:
          BASE_URL: https://www.saucedemo.com

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ui
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
