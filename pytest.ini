[pytest]
pythonpath = .
testpaths = tests
markers =
    ui: browser UI tests (Playwright)
    api: JSONPlaceholder API tests
    smoke: critical path scenarios (subset of ui/api; run first when regressions exist)
addopts =
    -v
    --strict-markers
    --junitxml=test-results/junit.xml
    --html=test-results/report.html
    --self-contained-html
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
    --output=test-results
junit_family = xunit2
