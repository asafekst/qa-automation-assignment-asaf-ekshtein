[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TID252"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep" = { msg = "Use Playwright expect() / auto-wait — never time.sleep in tests" }
"asyncio.sleep" = { msg = "Use Playwright expect() / auto-wait — never asyncio.sleep in tests" }

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402"]
